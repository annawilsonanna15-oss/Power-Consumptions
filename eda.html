{% extends "base.html" %}

{% block content %}

<h2>📊 Exploratory Data Analysis</h2>

<div class="error-box">
    {{ error }}
</div>
{% endif %}

{% if line_graph %}
<div class="chart-card">

</div>
{% endif %}

{% if decomp_graph %}
<div class="chart-card">
    {{ decomp_graph|safe }}
</div>
{% endif %}

{% endblock %}
